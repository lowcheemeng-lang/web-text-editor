<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- Inline SVG favicon: no extra request, no 404, and it still resolves offline. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%231e88e5'/%3E%3Ctext x='8' y='12' font-family='monospace' font-size='10' font-weight='bold' text-anchor='middle' fill='white'%3EN%3C/text%3E%3C/svg%3E"
    />
    <title>Notepad++ Web</title>
  </head>
  <body>
    <!--
      No backend, no network after first load (decision D1).
      #app is populated by Workspace: toolbar, tab strip, panes, status bar.
      A menu bar deliberately arrives with Task 4, once File ▸ Open / Save
      exist to put in it — see src/editor/chrome.ts.
    -->
    <main id="app"></main>

    <noscript>
      This editor is a client-side application and requires JavaScript.
    </noscript>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
